name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ci-public-linux-ephemeral
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1 candidate
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1 candidate
        with:
          components: rustfmt, clippy
          linux-dependencies: build
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1 candidate
        if: always()
