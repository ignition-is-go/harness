name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ci-public-linux-ephemeral
    timeout-minutes: 30
    steps:
      - uses: ignition-is-go/pulse-actions/rust-job-setup@3664557b5113a099b8990e4b296f58c40343c64f
        with:
          components: rustfmt, clippy
          linux-dependencies: base
          sccache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          sccache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          sccache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - uses: ignition-is-go/pulse-actions/resource-report@3664557b5113a099b8990e4b296f58c40343c64f
        if: always()
