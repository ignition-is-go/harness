[workspace]
resolver = "2"
members = [
    "crates/harness",
    "crates/harness-cli",
    "crates/harness-workflow",
    "crates/harness-tower",
    "crates/harness-github",
    "crates/harness-git",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ignition-is-go/harness"
version = "0.1.0"

[workspace.dependencies]
# Workspace-internal crates — referenced by path so an in-tree
# refactor doesn't require version bumps. Crates.io publish flow
# will swap these to versioned deps at release time.
harness = { path = "crates/harness", version = "0.1.0" }
harness-cli = { path = "crates/harness-cli", version = "0.1.0" }
harness-workflow = { path = "crates/harness-workflow", version = "0.1.0" }
harness-tower = { path = "crates/harness-tower", version = "0.1.0" }
harness-github = { path = "crates/harness-github", version = "0.1.0" }
harness-git = { path = "crates/harness-git", version = "0.1.0" }

# Shared external deps. Keeping versions pinned here means a single
# bump propagates through the whole tree.
async-trait = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"

anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
